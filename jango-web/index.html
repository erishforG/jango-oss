          }
        },
        {
          "@type": "Question",
          "name": "기존 가계부 앱과 무엇이 다른가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "기존 단식 가계부는 '얼마 썼는지'만 기록하지만, 잔고는 돈이 '어디서 어디로' 흘렀는지까지 자동 추적합니다. 그래서 자산이 시간에 따라 어떻게 변하는지, 신용카드 청구 기간이 어떻게 진행되는지, 예산 대비 얼마나 썼는지 모두 자동 계산됩니다."
          }
        },
        {
          "@type": "Question",
          "name": "복식부기를 몰라도 쓸 수 있나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "네. 복식부기 지식 없이 보통의 가계부처럼 '커피 5,000원 카드 결제'라고만 입력하면 잔고가 알아서 카드 부채 증가 + 식비 비용 발생으로 정리합니다. 사용자가 차변·대변을 직접 다룰 일은 없습니다."

          "name": "어떤 기기에서 쓸 수 있나요?",

            "@type": "Answer",
            "text": "웹 브라우저(데스크톱·모바일)와 PWA로 동작합니다. iOS Safari·Android Chrome에서 홈 화면에 추가하면 앱처럼 실행됩니다. 별도 설치 파일은 필요 없습니다."
