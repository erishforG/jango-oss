spring:
  cloud:
    gcp:
      sql:
        enabled: false
      firestore:
        enabled: false

  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
