name: Deploy Backend API to Cloud Run (Production)

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: jango-backend
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloud-run/${{ env.SERVICE }}:${{ github.ref_name }}
          docker build -t $IMAGE -f Dockerfile.backend \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_ADMIN_SECRET=${{ secrets.ADMIN_SECRET }} \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=auth.jango.monster \
            --build-arg VITE_API_BASE_URL=https://api.jango.monster \
            --build-arg VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_WEB }} \
            --build-arg VITE_APP_ENV=production \
            --build-arg VITE_RELEASE=${{ github.ref_name }} .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1536Mi \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-boost \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --set-env-vars "^|^SPRING_PROFILES_ACTIVE=prod|JANGO_SPA_ENABLED=true|DB_URL=${{ secrets.DB_URL }}|DB_USERNAME=${{ secrets.DB_USERNAME }}|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|SPRING_CLOUD_GCP_SQL_ENABLED=false|SPRING_AUTOCONFIGURE_EXCLUDE=com.google.cloud.spring.autoconfigure.sql.GcpCloudSqlAutoConfiguration|SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5|SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0|SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=10000|SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000|SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=180000|SPRING_FLYWAY_CONNECT_RETRIES=10|JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0|ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}|JANGO_WEBHOOK_PUBLIC_BASE_URL=https://api.jango.monster|JANGO_INVITE_BASE_URL=https://jango.monster/invite|SENTRY_DSN=${{ secrets.SENTRY_DSN_API }}|SENTRY_ENVIRONMENT=production|SENTRY_RELEASE=${{ github.ref_name }}|SENTRY_SEND_DEFAULT_PII=false|SENTRY_TRACES_SAMPLE_RATE=0.02|INTERNAL_JOBS_SECRET=${{ secrets.INTERNAL_JOBS_SECRET }}|MAIL_SMTP_HOST=${{ secrets.MAIL_SMTP_HOST }}|MAIL_SMTP_PORT=587|MAIL_SMTP_USERNAME=${{ secrets.MAIL_SMTP_USERNAME }}|MAIL_SMTP_PASSWORD=${{ secrets.MAIL_SMTP_PASSWORD }}"

      - name: Smoke Test
        run: |
          BASE=$(gcloud run services describe ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          sleep 15

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/health")
          echo "[1] /api/health → $STATUS"
          [ "$STATUS" = "200" ] || { echo "❌ health check failed"; exit 1; }

          # SPA root should serve index.html (consolidated SPA mode)
          BODY=$(curl -s "$BASE/")
          echo "[2] / first line → $(echo "$BODY" | head -1)"
          echo "$BODY" | grep -q "<!doctype html\|<!DOCTYPE html" \
            || { echo "❌ SPA root did not serve index.html"; exit 1; }

          echo "✅ Backend (with SPA) smoke tests passed!"
